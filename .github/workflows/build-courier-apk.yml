name: Build courier APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/build-courier-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare courier app
        run: |
          mkdir -p courier-app/www
          grep -q 'supabase.co' index.html
          sed 's/MODE:"customer"/MODE:"courier"/' index.html > courier-app/www/index.html
          grep -q 'MODE:"courier"' courier-app/www/index.html
          echo '{"name":"wasselni-courier","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^8.0.0","@capacitor/cli":"^8.0.0","@capacitor/core":"^8.0.0"}}' > courier-app/package.json
          echo '{"appId":"com.wasselni.courier","appName":"Wasselni Courier","webDir":"www","server":{"androidScheme":"https"}}' > courier-app/capacitor.config.json
      - name: Create Android project
        working-directory: courier-app
        run: |
          npm install
          npx cap add android
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">مندوب وصّلني</string>|; s|<string name="title_activity_main">[^<]*</string>|<string name="title_activity_main">مندوب وصّلني</string>|' android/app/src/main/res/values/strings.xml
          npx cap sync android
      - name: Build APK
        working-directory: courier-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wasselni-courier-apk
          path: courier-app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp courier-app/android/app/build/outputs/apk/debug/app-debug.apk wasselni-courier.apk
          gh release delete courier-latest --yes --cleanup-tag || true
          gh release create courier-latest wasselni-courier.apk --title "Wasselni Courier" --notes "Download wasselni-courier.apk and install it on the courier phone."
