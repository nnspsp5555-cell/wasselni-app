name: Build APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'index.ts', '.github/workflows/build-apks.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: admin
            cap: Admin
            ar: وصّلني المدير
            title: Wasselni Admin
            deps: '{"name":"wasselni-admin","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^8.0.0","@capacitor/core":"^8.0.0","@capacitor/push-notifications":"^8.0.0"},"devDependencies":{"@capacitor/cli":"^8.0.0"}}'
          - kind: courier
            cap: Courier
            ar: مندوب وصّلني
            title: Wasselni Courier
            deps: '{"name":"wasselni-courier","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^8.0.0","@capacitor/cli":"^8.0.0","@capacitor/core":"^8.0.0","@capacitor/push-notifications":"^8.0.0"}}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare app
        run: |
          mkdir -p ${{ matrix.kind }}-app/www
          grep -q 'supabase.co' index.html
          sed 's/MODE:"customer"/MODE:"${{ matrix.kind }}"/' index.html > ${{ matrix.kind }}-app/www/index.html
          grep -q 'MODE:"${{ matrix.kind }}"' ${{ matrix.kind }}-app/www/index.html
          echo '${{ matrix.deps }}' > ${{ matrix.kind }}-app/package.json
          echo '{"appId":"com.wasselni.${{ matrix.kind }}","appName":"Wasselni ${{ matrix.cap }}","webDir":"www","server":{"androidScheme":"https"}}' > ${{ matrix.kind }}-app/capacitor.config.json
      - name: Create Android project
        working-directory: ${{ matrix.kind }}-app
        run: |
          npm install
          npx cap add android
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">${{ matrix.ar }}</string>|; s|<string name="title_activity_main">[^<]*</string>|<string name="title_activity_main">${{ matrix.ar }}</string>|' android/app/src/main/res/values/strings.xml
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION "$M" || sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application|' "$M"
          grep -q ACCESS_FINE_LOCATION "$M"
          sed -i -E "s/versionCode( *=)? *[0-9]+/versionCode\1 ${{ github.run_number }}/" android/app/build.gradle
      - name: Push notifications setup
        working-directory: ${{ matrix.kind }}-app
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          A=android/app/src/main
          if [ -n "$GS_B64" ]; then echo "$GS_B64" | base64 -d > android/app/google-services.json; else echo "WARNING: no google-services.json, push disabled in this build"; fi
          mkdir -p $A/res/raw $A/res/drawable-xxhdpi $A/res/values
          echo '' | base64 -d > $A/res/drawable-xxhdpi/ic_stat_wasselni.png
          printf '<?xml version="1.0" encoding="utf-8"?><resources><color name="wasselni_orange">#F26A1B</color></resources>' > $A/res/values/colors_push.xml
          python3 - <<'PY'
          import wave, struct, math
          sr=22050; frames=[]
          for f,d in ((880,0.18),(1175,0.18),(1568,0.34)):
              n=int(sr*d)
              for i in range(n):
                  env=min(1,i/300)*min(1,(n-i)/1200)
                  frames.append(int(14000*env*math.sin(2*math.pi*f*i/sr)))
              frames += [0]*int(sr*0.04)
          w=wave.open("android/app/src/main/res/raw/wasselni.wav","wb"); w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
          w.writeframes(b"".join(struct.pack("<h",x) for x in frames)); w.close()
          PY
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$M" || sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application|' "$M"
          sed -i 's|</application>|<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_wasselni" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/wasselni_orange" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="orders" />\n    </application>|' "$M"
          grep -q default_notification_icon "$M"
      - name: Sync Capacitor
        working-directory: ${{ matrix.kind }}-app
        run: npx cap sync android
      - name: Build APK
        working-directory: ${{ matrix.kind }}-app/android
        env:
          KS_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then mkdir -p ~/.android && echo "$KS_B64" | base64 -d > ~/.android/debug.keystore; fi
          chmod +x gradlew
          ./gradlew assembleDebug
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | head -3 || true
      - uses: actions/upload-artifact@v4
        with:
          name: wasselni-${{ matrix.kind }}-apk
          path: ${{ matrix.kind }}-app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ${{ matrix.kind }}-app/android/app/build/outputs/apk/debug/app-debug.apk wasselni-${{ matrix.kind }}.apk
          gh release delete ${{ matrix.kind }}-latest --yes --cleanup-tag || true
          gh release create ${{ matrix.kind }}-latest wasselni-${{ matrix.kind }}.apk --title "${{ matrix.title }}" --notes "Download wasselni-${{ matrix.kind }}.apk and install it on the ${{ matrix.kind }} phone."
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Set secrets (server side only)
        run: |
          supabase secrets set --yes --project-ref gvsuenendqtbutesncll \
            FCM_SERVICE_ACCOUNT="$(echo '${{ secrets.FCM_SERVICE_ACCOUNT_B64 }}' | base64 -d)" \
            PUSH_WEBHOOK_SECRET='${{ secrets.PUSH_WEBHOOK_SECRET }}'
      - name: Place function file
        run: |
          if [ -f index.ts ]; then
            mkdir -p supabase/functions/send-push
            cp index.ts supabase/functions/send-push/index.ts
          fi
          ls -l supabase/functions/send-push/
      - name: Deploy function
        run: supabase functions deploy send-push --no-verify-jwt --project-ref gvsuenendqtbutesncll --yes
